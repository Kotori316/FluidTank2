name: Release
on:
  workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - run: chmod +x ./gradlew
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false
          add-job-summary: 'on-failure'
      - name: Check Release Version
        run: ./gradlew checkReleaseVersion --no-daemon
        env:
          RELEASE_DEBUG: false
      - name: Compile
        run: ./gradlew testClasses --no-daemon
      - name: JUnit
        run: ./gradlew test --no-daemon
        env:
          RUN_JUNIT: true
          DISABLE_FORGE: true
      - name: GameTest
        run: ./gradlew runGameTestServer
        env:
          RUN_GAME_TEST: true
          DISABLE_FORGE: true

  release:
    needs: [ check ]
    permissions:
      id-token: write
      contents: write
      packages: write
      attestations: write
      artifact-metadata: write
      # See https://github.com/Kotori316/common-script/blob/v2/.github/workflows/release-prod-gradle.yaml
    uses: 'Kotori316/common-script/.github/workflows/release-prod-gradle.yaml@cc63e8610e21a91ed102150d078b10d216e02b76' # v2.0.3
    with:
      sign_check_command: 'assemble publishToMavenLocal --no-daemon'
      release_command: 'assemble publishToMavenLocal publishMods registerVersion publish --continue --no-daemon'
      enable_signature_check: true
      java_version: '25'
      use_gradle_cache: true
    secrets: inherit
