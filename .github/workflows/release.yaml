name: Release
on:
  workflow_dispatch

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      packages: write
      attestations: write
    # See https://github.com/Kotori316/common-script/blob/main/.github/workflows/release-prod-gradle.yaml
    uses: 'Kotori316/common-script/.github/workflows/release-prod-gradle.yaml@main'
    with:
      sign_check_command: 'checkReleaseVersion assemble publishToMavenLocal --no-daemon'
      release_command: 'assemble publishToMavenLocal githubRelease curseforge modrinth registerVersion publish --continue --no-daemon'
      enable_signature_check: true
      java_version: 21
      use_gradle_cache: true
    secrets: inherit
